name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Forge contracts
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.foundry/bin:$HOME/.config/.foundry/bin:$PATH"
          foundryup
          cd contracts && forge test
      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --registry=https://npm.pkg.github.com || echo "nothing to publish (no npm token/host)"
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "AEGIS $GITHUB_REF_NAME" --generate-notes || true
