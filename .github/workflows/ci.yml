name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Python prototype
        run: |
          pip install pytest -q
          python3 -m pytest test_aegis.py -v
      - name: Forge contracts
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.foundry/bin:$HOME/.config/.foundry/bin:$PATH"
          foundryup
          cd contracts && forge test -vv
      - name: Wallet build + tests
        run: |
          cd wallet-mobile
          npm ci
          npm test
          npm run build
      - name: Slither (contracts)
        run: |
          pip install slither-analyzer -q || true
          cd contracts && slither . --filter-paths 'test/' --json slither.json 2>&1 | tail -20 || echo "slither found (see slither.json)"
      - name: Audit artifact (contracts grep)
        run: |
          echo "contracts: $(ls -1 contracts/*.sol)"
          echo "--- slither output archived as artifact"
