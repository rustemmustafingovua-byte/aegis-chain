apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-node
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aegis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aegis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis
spec:
  podSelector:
    matchLabels:
      app: aegis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8899
        - port: 3899
        - port: 4899
